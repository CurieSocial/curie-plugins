<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Curie">
  <title>Curie</title>
  <!-- The plugin's tile: the beehive on Curie's ink, the same pairing the
       macOS app icon uses, so the plugin reads as Curie in a list of icons.
       Corner radius keeps the app icon's 16/76 of the side. -->
  <rect width="512" height="512" rx="108" fill="#1E1A17" />
  <!-- The mark from curie-beehive.svg, unchanged, at the field's pitch times
       seven. Its ink is 46.5 x 34.5, so at that scale it is 325.5 x 241.5,
       which leaves 93 either side and 135 above. -->
  <g transform="translate(93 135) scale(7)" fill="#F67222">
    <rect x="12" y="0" width="10.5" height="10.5" rx="1.5" />
    <rect x="24" y="0" width="10.5" height="10.5" rx="1.5" />
    <rect x="0" y="12" width="10.5" height="10.5" rx="1.5" />
    <rect x="36" y="12" width="10.5" height="10.5" rx="1.5" />
    <rect x="12" y="24" width="10.5" height="10.5" rx="1.5" />
    <rect x="24" y="24" width="10.5" height="10.5" rx="1.5" />
  </g>
</svg>
