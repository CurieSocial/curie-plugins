name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A strict YAML parser, for the skill frontmatter
        run: python3 -m pip install --quiet --break-system-packages pyyaml
      - name: The manifests agree
        run: python3 scripts/check_manifests.py --no-hosts
      - name: The gate refuses a repository that does not
        run: python3 scripts/check_manifests_test.py

  hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Claude Code accepts the plugin
        run: claude plugin validate --strict ./plugins/curie
      - name: Claude Code accepts the marketplace
        run: claude plugin validate --strict .
